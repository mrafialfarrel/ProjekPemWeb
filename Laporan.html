<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan | sak-ku</title>
    <link rel="stylesheet" href="laporan.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="top-navbar">
        <div class="nav-content">
            <button class="icon-btn" onclick="window.location.href='Dashboard.html'">
                <i data-feather="arrow-left"></i>
            </button>
            <h1>Laporan Keuangan</h1>
            <div class="nav-actions">
                <button class="icon-btn" id="themeToggle"></button>
            </div>
        </div>
    </header>

    <main class="laporan-container">
        
        <div class="action-bar">
            <button class="download-btn" onclick="openDownloadSheet()">
                <i data-feather="download" width="16" height="16"></i> Unduh
            </button>
            
            <div class="time-filter">
                <button class="filter-btn active" onclick="changeFilter(this)">1 Minggu</button>
                <button class="filter-btn" onclick="changeFilter(this)">2 Minggu</button>
                <button class="filter-btn" onclick="changeFilter(this)">1 Bulan</button>
            </div>
        </div>

        <div class="chart-card">
            <canvas id="financeChart"></canvas>
        </div>

        <div class="summary-cards">
            <div class="summary-box income-box">
                <div class="sum-icon"><i data-feather="arrow-down-circle"></i></div>
                <div class="sum-text">
                    <p>Total Pemasukan</p>
                    <h4>Rp 5.200.000</h4>
                </div>
            </div>
            <div class="summary-box expense-box">
                <div class="sum-icon"><i data-feather="arrow-up-circle"></i></div>
                <div class="sum-text">
                    <p>Total Pengeluaran</p>
                    <h4>Rp 3.150.000</h4>
                </div>
            </div>
        </div>

        <section class="category-section">
            <h3>Kategori Pengeluaran</h3>
            
            <div class="category-item">
                <div class="cat-header">
                    <div class="cat-title">
                        <div class="cat-icon" style="color: #FF9800; background: rgba(255, 152, 0, 0.1);"><i data-feather="coffee"></i></div>
                        <span>Makanan & Minuman</span>
                    </div>
                    <span class="cat-amount">Rp 1.200.000</span>
                </div>
                <div class="cat-progress">
                    <div class="cat-fill" style="width: 45%; background-color: #FF9800;"></div>
                </div>
            </div>

            <div class="category-item">
                <div class="cat-header">
                    <div class="cat-title">
                        <div class="cat-icon" style="color: #2196F3; background: rgba(33, 150, 243, 0.1);"><i data-feather="wifi"></i></div>
                        <span>Tagihan & Utilitas</span>
                    </div>
                    <span class="cat-amount">Rp 800.000</span>
                </div>
                <div class="cat-progress">
                    <div class="cat-fill" style="width: 30%; background-color: #2196F3;"></div>
                </div>
            </div>

            <div class="category-item">
                <div class="cat-header">
                    <div class="cat-title">
                        <div class="cat-icon" style="color: #F44336; background: rgba(244, 67, 54, 0.1);"><i data-feather="shopping-bag"></i></div>
                        <span>Belanja Bulanan</span>
                    </div>
                    <span class="cat-amount">Rp 1.150.000</span>
                </div>
                <div class="cat-progress">
                    <div class="cat-fill" style="width: 38%; background-color: #F44336;"></div>
                </div>
            </div>
        </section>

    </main>

    <div class="bottom-sheet-overlay" id="downloadOverlay" onclick="closeDownloadSheet()"></div>
    <div class="bottom-sheet" id="downloadSheet">
        <div class="sheet-drag-handle"></div>
        <div class="sheet-header">
            <h3>Unduh Laporan Keuangan</h3>
            <button class="icon-btn close-sheet-btn" onclick="closeDownloadSheet()">
                <i data-feather="x" width="20" height="20"></i>
            </button>
        </div>
        
        <div class="sheet-content">
            <div class="form-group">
                <label>Pilih Jangka Waktu Laporan</label>
                <select class="form-input">
                    <option value="1w">1 Minggu Terakhir</option>
                    <option value="2w">2 Minggu Terakhir</option>
                    <option value="1m">1 Bulan Terakhir</option>
                    <option value="3m">3 Bulan Terakhir</option>
                    <option value="all">Semua Riwayat</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pilih Format File</label>
                <select class="form-input">
                    <option value="pdf">Dokumen PDF (.pdf)</option>
                    <option value="excel">Microsoft Excel (.xlsx)</option>
                    <option value="csv">Data CSV (.csv)</option>
                </select>
            </div>
            
            <button class="save-btn" onclick="simulateDownload()">
                <i data-feather="download" width="18" height="18" style="margin-right: 8px;"></i> Mulai Unduh
            </button>
        </div>
    </div>

    <script src="laporan.js"></script>
</body>
</html>
